name: Créer les VM Oracle Always Free

# Une seule boucle pour tout le compte (chasser.sh) : VM « netbox » (Micro) et VM ARM
# « audit-hbo-arm » (2 cœurs / 12 Go au plus, limite gratuite), à tour de rôle, ~1 essai
# toutes les 2 min. Chaque VM créée : issue (e-mail GitHub). Toutes créées : robot désactivé.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: create-vm
  cancel-in-progress: false

permissions:
  actions: write
  issues: write
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      SUPPRESS_LABEL_WARNING: "True"
      PYTHONWARNINGS: ignore
      OCI_CLI_CONFIG_FILE: ${{ github.workspace }}/.oci/config
      COMPARTMENT: ${{ secrets.OCI_COMPARTMENT }}
      SUBNET: ${{ secrets.OCI_SUBNET }}
      AD: ${{ secrets.OCI_AD }}
      ARM_IMAGE: ${{ secrets.OCI_ARM_IMAGE }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurer l'accès Oracle
        env:
          OCI_KEY: ${{ secrets.OCI_KEY }}
        run: |
          mkdir -p .oci && chmod 700 .oci
          printf '%s\n' "$OCI_KEY" > .oci/key.pem && chmod 600 .oci/key.pem
          cat > .oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY }}
          region=${{ secrets.OCI_REGION }}
          key_file=${{ github.workspace }}/.oci/key.pem
          EOF
          chmod 600 .oci/config
          pip install --quiet --disable-pip-version-check oci-cli

      # Configuration de démarrage de NetBox : cloud-init, puis Tailscale avec la clé à usage
      # unique (secret TS_AUTHKEY, jamais affichée). Sans le secret, la cible netbox est ignorée.
      - name: Préparer la VM NetBox
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          [ -n "$TS_AUTHKEY" ] || { echo "Secret TS_AUTHKEY absent : NetBox ignorée."; exit 0; }
          [[ "$TS_AUTHKEY" =~ ^tskey-auth-[A-Za-z0-9_-]+$ ]] || { echo "::error::TS_AUTHKEY n'est pas une clé tskey-auth-…"; exit 1; }
          ( umask 077
            cat netbox-cloud-init.yaml
            printf "  - curl -fsSL https://tailscale.com/install.sh | sh\n"
            printf "  - [sh, -c, \"umask 077; printf %%s '%s' > /run/netbox-tailscale.cle\"]\n" "$TS_AUTHKEY"
            printf "  - tailscale up --hostname=netbox --auth-key=file:/run/netbox-tailscale.cle\n"
            printf "  - rm -f /run/netbox-tailscale.cle\n"
          ) > .oci/netbox-user-data.yaml

      - name: Chasser les VM manquantes
        id: hunt
        env:
          GH_TOKEN: ${{ github.token }}
          ON_CREATED: ./prevenir.sh
        run: |
          [ -s .oci/netbox-user-data.yaml ] && export NETBOX_USER_DATA=.oci/netbox-user-data.yaml
          ./chasser.sh

      - name: Nettoyer
        if: always()
        run: rm -rf .oci

      - name: "Tout est créé : arrêter le robot"
        if: steps.hunt.outcome == 'success' && steps.hunt.outputs.remaining == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable create-vm.yml --repo "$GITHUB_REPOSITORY"

      # Le robot se relance lui-même à la fin de chaque passage (workflow_dispatch est
      # autorisé avec GITHUB_TOKEN). Le cron reste en filet de sécurité.
      - name: Relancer
        if: steps.hunt.outcome == 'success' && steps.hunt.outputs.remaining != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run create-vm.yml --repo "$GITHUB_REPOSITORY"
